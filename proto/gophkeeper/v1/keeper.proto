edition = "2023";

package gophkeeper.v1;

import "google/protobuf/go_features.proto";
import "google/protobuf/timestamp.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/kkapel/gophkeeper/gophkeeper/internal/proto/gophkeeper/v1;gophkeeperv1";

// KeeperService управляет приватными данными пользователя.
service KeeperService {
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  rpc UpdateItem(UpdateItemRequest) returns (UpdateItemResponse);
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse);
}

// ItemType — тип хранимых данных. Zero-значение UNSPECIFIED обязательно
// по стайлгайду protobuf и служит защитой от «случайного нуля».
enum ItemType {
  ITEM_TYPE_UNSPECIFIED = 0;
  ITEM_TYPE_CREDENTIALS = 1;
  ITEM_TYPE_TEXT        = 2;
  ITEM_TYPE_BINARY      = 3;
  ITEM_TYPE_CARD        = 4;
}

// Item — запись как её отдаёт сервер клиенту.
message Item {
  string id = 1;
  ItemType type = 2;
  bytes encrypted_payload = 3;
  string metadata = 4;
  int64 version = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// CreateItemRequest НЕ содержит id — его генерирует сервер (online-only).
// user_id тоже отсутствует: сервер берёт владельца из JWT в interceptor'е.
message CreateItemRequest {
  ItemType type = 1;
  bytes encrypted_payload = 2;
  string metadata = 3;
}

message CreateItemResponse {
  string id = 1;
  int64 version = 2;
}

message GetItemRequest {
  string id = 1;
}

message GetItemResponse {
  Item item = 1;
}

message ListItemsRequest {}

message ListItemsResponse {
  repeated Item items = 1;
}

// UpdateItemRequest содержит version — клиент присылает версию, которую
// редактировал, для оптимистичной блокировки.
message UpdateItemRequest {
  string id = 1;
  bytes encrypted_payload = 2;
  string metadata = 3;
  int64 version = 4;
}

message UpdateItemResponse {
  int64 version = 1;
}

message DeleteItemRequest {
  string id = 1;
}

message DeleteItemResponse {}